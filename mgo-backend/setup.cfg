[importlinter]
root_package = app
include_external_packages = True

[importlinter:contract:modules-independent]
name = Modules must not import each other directly
type = independence
modules =
    app.modules.identity
    app.modules.billing
    app.modules.knowledge
    app.modules.embedding
    app.modules.retrieval
    app.modules.agent
    app.modules.chat
    app.modules.platform

[importlinter:contract:firebase-sdk-restricted]
name = Only identity may import the Firebase SDK
type = forbidden
source_modules =
    app.modules.billing
    app.modules.knowledge
    app.modules.embedding
    app.modules.retrieval
    app.modules.agent
    app.modules.chat
    app.modules.platform
forbidden_modules =
    app.core.firebase
    firebase_admin